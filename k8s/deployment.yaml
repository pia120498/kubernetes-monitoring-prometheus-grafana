apiVersion: apps/v1
kind: Deployment

metadata:
  name: monitoring-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: monitoring-app

  template:
    metadata:
      labels:
        app: monitoring-app

    spec:
      containers:
      - name: monitoring-app
        image: priyamal/monitoring-app:v1

        ports:
        - containerPort: 5000