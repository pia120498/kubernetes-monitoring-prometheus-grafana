apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config

data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: "monitoring-app"

        metrics_path: /metrics

        static_configs:
          - targets:
              - monitoring-app-service:5000
      
      - job_name: "node-exporter"

        static_configs:
          - targets:
              - node-exporter-service:9100